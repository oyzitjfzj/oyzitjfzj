<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="150" viewBox="0 0 1200 150" role="img" aria-label="NYXAR sequence">
  <style>
    .line{font:400 17px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;letter-spacing:1.5px;fill:#8b949e}
    .cursor{fill:#c9d1d9}
  </style>

  <g text-anchor="middle">
    <text x="600" y="76" class="line" opacity="0">Some things are not announced. They arrive.
      <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;.05;.20;.25;1" dur="20s" repeatCount="indefinite"/>
    </text>
    <text x="600" y="76" class="line" opacity="0">Build first. Explain later.
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;.25;.30;.45;.50;1" dur="20s" repeatCount="indefinite"/>
    </text>
    <text x="600" y="76" class="line" opacity="0">When it matters, you'll know.
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;.50;.55;.70;.75;1" dur="20s" repeatCount="indefinite"/>
    </text>
    <text x="600" y="76" class="line" opacity="0">Until then, the work continues.
      <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;.75;.80;.95;1" dur="20s" repeatCount="indefinite"/>
    </text>
  </g>

  <rect x="592" y="104" width="16" height="1" class="cursor" opacity="0.15">
    <animate attributeName="opacity" values="0.08;0.65;0.08" dur="2.4s" repeatCount="indefinite"/>
    <animate attributeName="width" values="16;56;16" dur="7s" repeatCount="indefinite"/>
    <animate attributeName="x" values="592;572;592" dur="7s" repeatCount="indefinite"/>
  </rect>
</svg>