<svg xmlns="http://www.w3.org/2000/svg" width="860" height="360" viewBox="0 0 860 360" role="img" aria-label="NYXAR MIND — Less noise. More depth.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#05070A"/>
      <stop offset="0.55" stop-color="#090D14"/>
      <stop offset="1" stop-color="#05070A"/>
    </linearGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4C8DFF" stop-opacity="0"/>
      <stop offset="0.44" stop-color="#4C8DFF" stop-opacity="0.2"/>
      <stop offset="0.5" stop-color="#B8DDFF" stop-opacity="0.95"/>
      <stop offset="0.56" stop-color="#4C8DFF" stop-opacity="0.2"/>
      <stop offset="1" stop-color="#4C8DFF" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="halo">
      <stop offset="0" stop-color="#4C8DFF" stop-opacity="0.18"/>
      <stop offset="0.45" stop-color="#4C8DFF" stop-opacity="0.06"/>
      <stop offset="1" stop-color="#4C8DFF" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="16"/>
    </filter>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="card"><rect x="1" y="1" width="858" height="358" rx="18"/></clipPath>
  </defs>

  <rect x="1" y="1" width="858" height="358" rx="18" fill="url(#bg)" stroke="#1B2432"/>
  <g clip-path="url(#card)">
    <ellipse cx="430" cy="36" rx="340" ry="155" fill="url(#halo)" filter="url(#soft)">
      <animate attributeName="opacity" values="0.45;0.9;0.45" dur="8s" repeatCount="indefinite"/>
    </ellipse>

    <path d="M82 77H778" stroke="#17202D" stroke-width="1"/>
    <path d="M82 77H778" stroke="url(#beam)" stroke-width="1.4" stroke-linecap="round" stroke-dasharray="130 566">
      <animate attributeName="stroke-dashoffset" values="696;-696" dur="7.5s" repeatCount="indefinite"/>
    </path>

    <circle cx="82" cy="77" r="3" fill="#4C8DFF" filter="url(#glow)">
      <animate attributeName="opacity" values="0.25;1;0.25" dur="4.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="778" cy="77" r="3" fill="#4C8DFF" filter="url(#glow)">
      <animate attributeName="opacity" values="1;0.25;1" dur="4.5s" repeatCount="indefinite"/>
    </circle>

    <text x="430" y="58" text-anchor="middle" fill="#8FA2B8" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="11" font-weight="600" letter-spacing="6">NYXAR MIND</text>

    <text x="430" y="151" text-anchor="middle" fill="#F7FBFF" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="48" font-weight="720" letter-spacing="2.4">LESS NOISE.</text>
    <text x="430" y="211" text-anchor="middle" fill="#4C8DFF" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="48" font-weight="720" letter-spacing="2.4" filter="url(#glow)">MORE DEPTH.</text>

    <rect x="344" y="236" width="172" height="2" rx="1" fill="#17202D"/>
    <rect x="344" y="236" width="44" height="2" rx="1" fill="#4C8DFF">
      <animate attributeName="x" values="344;472;344" dur="6s" repeatCount="indefinite"/>
      <animate attributeName="width" values="44;22;44" dur="6s" repeatCount="indefinite"/>
    </rect>

    <g font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="15" font-weight="500" letter-spacing="0.8" text-anchor="middle">
      <text x="430" y="286" fill="#C8D4E3" opacity="0">Quiet work. Long horizons.
        <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.08;0.27;0.34;1" dur="15s" repeatCount="indefinite"/>
      </text>
      <text x="430" y="286" fill="#C8D4E3" opacity="0">Built first. Spoken later.
        <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.32;0.40;0.60;0.67;1" dur="15s" repeatCount="indefinite"/>
      </text>
      <text x="430" y="286" fill="#C8D4E3" opacity="0">Until then, the work continues.
        <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.65;0.73;0.93;1" dur="15s" repeatCount="indefinite"/>
      </text>
    </g>

    <g opacity="0.58">
      <circle cx="405" cy="320" r="2" fill="#52657C"/>
      <circle cx="430" cy="320" r="2" fill="#4C8DFF" filter="url(#glow)">
        <animate attributeName="opacity" values="0.25;1;0.25" dur="3s" repeatCount="indefinite"/>
      </circle>
      <circle cx="455" cy="320" r="2" fill="#52657C"/>
    </g>
  </g>
</svg>