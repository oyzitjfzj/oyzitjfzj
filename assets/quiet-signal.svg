<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-label="NYXAR MIND — quiet signal">
  <defs>
    <linearGradient id="edge" x1="0" x2="1">
      <stop offset="0" stop-color="#8b949e" stop-opacity="0"/>
      <stop offset="0.18" stop-color="#8b949e" stop-opacity="0.18"/>
      <stop offset="0.50" stop-color="#c9d1d9" stop-opacity="0.55"/>
      <stop offset="0.82" stop-color="#8b949e" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#8b949e" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="pulse">
      <stop offset="0" stop-color="#f0f6fc" stop-opacity="0.95"/>
      <stop offset="0.25" stop-color="#c9d1d9" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#8b949e" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-200%" y="-200%" width="400%" height="400%">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
    <style>
      .title{font:600 42px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;letter-spacing:13px;fill:#e6edf3}
      .small{font:500 11px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;letter-spacing:3px;fill:#8b949e}
      .tag{font:500 13px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;letter-spacing:5px;fill:#c9d1d9}
      .micro{font:400 10px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;letter-spacing:2px;fill:#6e7681}
    </style>
  </defs>

  <!-- frame -->
  <path d="M84 70H1116" stroke="url(#edge)" stroke-width="1"/>
  <path d="M84 350H1116" stroke="url(#edge)" stroke-width="1"/>
  <path d="M148 112H430 M770 112H1052" stroke="#30363d" stroke-width="1" opacity="0.55"/>
  <path d="M148 308H430 M770 308H1052" stroke="#30363d" stroke-width="1" opacity="0.35"/>

  <!-- corner telemetry -->
  <text x="148" y="102" class="micro">STATUS / ACTIVE</text>
  <text x="1052" y="102" class="micro" text-anchor="end">SIGNAL / QUIET</text>
  <text x="148" y="327" class="micro">MODE / BUILD</text>
  <text x="1052" y="327" class="micro" text-anchor="end">NOISE / LOW</text>

  <!-- central restrained motion -->
  <g transform="translate(600 178)">
    <circle r="58" fill="none" stroke="#30363d" stroke-width="1" opacity="0.42"/>
    <circle r="38" fill="none" stroke="#30363d" stroke-width="1" stroke-dasharray="2 12" opacity="0.52">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="28s" repeatCount="indefinite"/>
    </circle>
    <circle r="20" fill="none" stroke="#8b949e" stroke-width="1" stroke-dasharray="18 108" opacity="0.55">
      <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="13s" repeatCount="indefinite"/>
    </circle>

    <circle r="28" fill="url(#pulse)" filter="url(#soft)" opacity="0">
      <animate attributeName="opacity" values="0;0.24;0.08;0" dur="6s" repeatCount="indefinite"/>
      <animate attributeName="r" values="18;34;24;18" dur="6s" repeatCount="indefinite"/>
    </circle>
    <circle r="2.5" fill="#f0f6fc">
      <animate attributeName="opacity" values="0.5;1;0.5" dur="3s" repeatCount="indefinite"/>
    </circle>

    <g>
      <circle cx="0" cy="-58" r="2" fill="#c9d1d9" opacity="0.75"/>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="18s" repeatCount="indefinite"/>
    </g>
    <g>
      <circle cx="0" cy="-38" r="1.6" fill="#8b949e" opacity="0.65"/>
      <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="11s" repeatCount="indefinite"/>
    </g>
  </g>

  <!-- scan traces -->
  <g opacity="0.55">
    <path d="M164 178H486" stroke="#30363d" stroke-width="1"/>
    <path d="M714 178H1036" stroke="#30363d" stroke-width="1"/>
    <circle r="2.4" fill="#c9d1d9">
      <animateMotion dur="7.5s" repeatCount="indefinite" path="M164 178 H486"/>
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.08;0.92;1" dur="7.5s" repeatCount="indefinite"/>
    </circle>
    <circle r="2.4" fill="#c9d1d9">
      <animateMotion dur="8.5s" repeatCount="indefinite" path="M1036 178 H714"/>
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.08;0.92;1" dur="8.5s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- identity -->
  <text x="600" y="267" text-anchor="middle" class="title">NYXAR MIND</text>
  <text x="600" y="298" text-anchor="middle" class="tag">LESS NOISE. MORE DEPTH.</text>

  <!-- periodic sweep -->
  <rect x="150" y="118" width="1" height="188" fill="#8b949e" opacity="0">
    <animate attributeName="x" values="150;1050" dur="9s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;0.12;0.12;0" keyTimes="0;0.08;0.92;1" dur="9s" repeatCount="indefinite"/>
  </rect>
</svg>